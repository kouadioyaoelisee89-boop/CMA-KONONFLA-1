<!-- ============================================================
     KingdomHub PWA — Configuration "fichiers statiques"
     Remplace le bloc Blob URL (compatible file://) par une vraie
     configuration PWA permettant l'installation comme application.

     FICHIERS À DÉPLOYER dans le même dossier que index.html :
       • manifest.json   (ce fichier)
       • sw.js           (Service Worker)
       • icon-192.png    (icône 192×192)
       • icon-512.png    (icône 512×512)

     INSTRUCTIONS D'INTÉGRATION :
     1. Dans <head>, remplacez :
           <link id="pwa-manifest" rel="manifest"/>
        Par :
           <link rel="manifest" href="manifest.json"/>

     2. Supprimez tout le bloc IIFE PWA (function() { ... })()
        qui crée les Blob URLs (lignes ~19930 à ~20305)

     3. Ajoutez ce bloc <script> juste avant </body> :
     ============================================================ -->

<script>
/* ── KingdomHub PWA — Enregistrement Service Worker (fichier statique) ── */
(function () {
  'use strict';

  /* Apple touch icon (même icône que le manifest) */
  var appleIcon = document.createElement('link');
  appleIcon.rel  = 'apple-touch-icon';
  appleIcon.href = 'icon-192.png';
  document.head.appendChild(appleIcon);

  /* Enregistrement du Service Worker */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(function(reg) {
        console.log('[KingdomHub PWA] Service Worker enregistré ✓', reg.scope);
      })
      .catch(function(err) {
        console.warn('[KingdomHub PWA] SW non enregistré :', err);
      });

    /* ── Bannière "Installer l'appli" (Android Chrome) ── */
    var deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;

      /* Vérifier si déjà dismissé récemment (7 jours) */
      try {
        var dismissed = localStorage.getItem('kingdom_pwa_dismissed');
        if (dismissed && Date.now() - Number(dismissed) < 7 * 86400000) return;
      } catch(ex) {}

      showInstallBanner();
    });

    window.addEventListener('appinstalled', function() {
      deferredPrompt = null;
      hideInstallBanner();
      console.log('[KingdomHub PWA] Application installée ✓');
    });

    /* Expose la fonction d'installation pour le bouton de la bannière */
    window._pwaInstall = function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(choice) {
        if (choice.outcome === 'accepted') {
          console.log('[KingdomHub PWA] Installation acceptée');
        }
        deferredPrompt = null;
        hideInstallBanner();
      });
    };
  }

  /* ── Helpers bannière (doivent exister dans index.html) ── */
  function showInstallBanner() {
    if (typeof window.showInstallBanner === 'function') {
      window.showInstallBanner();
    }
  }
  function hideInstallBanner() {
    if (typeof window.hideInstallBanner === 'function') {
      window.hideInstallBanner();
    }
  }
})();
</script>
